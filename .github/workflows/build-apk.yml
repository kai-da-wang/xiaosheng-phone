name: Build local AI Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/prepare-android-site.py'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled runner toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          if [ -z "$SDK_MANAGER" ]; then echo "Android commandline tools not installed"; exit 1; fi
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Bundle the ORIGINAL OFFLINE-ONLY site into the APK
        run: python3 scripts/prepare-android-site.py
      - name: Build APK (debug-signed for personal sideload)
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaosheng-LocalAI-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
